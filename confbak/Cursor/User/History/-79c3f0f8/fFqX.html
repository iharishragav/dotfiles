<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
        }

        .score {
            text-align: center;
        }

        .score h3 {
            margin-bottom: 5px;
        }

        .score span {
            font-size: 1.5em;
            font-weight: bold;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 300px;
            margin: 0 auto 20px;
        }

        .cell {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 10px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .cell.x {
            color: #ff6b6b;
        }

        .cell.o {
            color: #4ecdc4;
        }

        .cell.winning {
            background: rgba(255, 215, 0, 0.3);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .controls {
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            border: none;
            color: white;
            padding: 12px 24px;
            font-size: 1.1em;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .winner-message {
            font-size: 1.5em;
            margin: 20px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .current-player {
            font-size: 1.3em;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 Tic-Tac-Toe</h1>
        
        <div class="score-board">
            <div class="score">
                <h3>Player X</h3>
                <span id="scoreX">0</span>
            </div>
            <div class="score">
                <h3>Draws</h3>
                <span id="scoreDraw">0</span>
            </div>
            <div class="score">
                <h3>Player O</h3>
                <span id="scoreO">0</span>
            </div>
        </div>

        <div class="current-player" id="currentPlayer">
            Current Player: <span id="playerSymbol">X</span>
        </div>

        <div class="game-board" id="gameBoard">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>

        <div class="winner-message" id="winnerMessage" style="display: none;"></div>

        <div class="controls">
            <button class="btn" onclick="resetGame()">🔄 New Game</button>
            <button class="btn" onclick="resetScore()">📊 Reset Score</button>
        </div>
    </div>

    <script>
        class TicTacToe {
            constructor() {
                this.board = ['', '', '', '', '', '', '', '', ''];
                this.currentPlayer = 'X';
                this.gameActive = true;
                this.scores = { X: 0, O: 0, draw: 0 };
                
                this.winningConditions = [
                    [0, 1, 2],
                    [3, 4, 5],
                    [6, 7, 8],
                    [0, 3, 6],
                    [1, 4, 7],
                    [2, 5, 8],
                    [0, 4, 8],
                    [2, 4, 6]
                ];
                
                this.initializeGame();
            }

            initializeGame() {
                this.board = ['', '', '', '', '', '', '', '', ''];
                this.currentPlayer = 'X';
                this.gameActive = true;
                
                document.querySelectorAll('.cell').forEach(cell => {
                    cell.textContent = '';
                    cell.classList.remove('x', 'o', 'winning');
                    cell.disabled = false;
                });
                
                document.getElementById('winnerMessage').style.display = 'none';
                this.updateCurrentPlayer();
            }

            makeMove(index) {
                if (this.board[index] !== '' || !this.gameActive) {
                    return;
                }

                this.board[index] = this.currentPlayer;
                this.updateDisplay();
                
                if (this.checkWinner()) {
                    this.gameActive = false;
                    this.scores[this.currentPlayer]++;
                    this.showWinner(this.currentPlayer);
                } else if (this.checkDraw()) {
                    this.gameActive = false;
                    this.scores.draw++;
                    this.showWinner('draw');
                } else {
                    this.currentPlayer = this.currentPlayer === 'X' ? 'O' : 'X';
                    this.updateCurrentPlayer();
                }
            }

            updateDisplay() {
                document.querySelectorAll('.cell').forEach((cell, index) => {
                    if (this.board[index] !== '') {
                        cell.textContent = this.board[index];
                        cell.classList.add(this.board[index].toLowerCase());
                    }
                });
            }

            checkWinner() {
                return this.winningConditions.some(condition => {
                    const [a, b, c] = condition;
                    if (this.board[a] && this.board[a] === this.board[b] && this.board[a] === this.board[c]) {
                        this.highlightWinningCells(condition);
                        return true;
                    }
                    return false;
                });
            }

            highlightWinningCells(condition) {
                condition.forEach(index => {
                    document.querySelector(`[data-index="${index}"]`).classList.add('winning');
                });
            }

            checkDraw() {
                return this.board.every(cell => cell !== '');
            }

            showWinner(winner) {
                const winnerMessage = document.getElementById('winnerMessage');
                if (winner === 'draw') {
                    winnerMessage.textContent = "🤝 It's a Draw!";
                    winnerMessage.style.background = 'rgba(255, 193, 7, 0.3)';
                } else {
                    winnerMessage.textContent = `🎉 Player ${winner} Wins!`;
                    winnerMessage.style.background = winner === 'X' ? 'rgba(255, 107, 107, 0.3)' : 'rgba(78, 205, 196, 0.3)';
                }
                winnerMessage.style.display = 'block';
                this.updateScore();
            }

            updateCurrentPlayer() {
                document.getElementById('playerSymbol').textContent = this.currentPlayer;
                document.getElementById('playerSymbol').style.color = this.currentPlayer === 'X' ? '#ff6b6b' : '#4ecdc4';
            }

            updateScore() {
                document.getElementById('scoreX').textContent = this.scores.X;
                document.getElementById('scoreO').textContent = this.scores.O;
                document.getElementById('scoreDraw').textContent = this.scores.draw;
            }

            resetGame() {
                this.initializeGame();
            }

            resetScore() {
                this.scores = { X: 0, O: 0, draw: 0 };
                this.updateScore();
                this.resetGame();
            }
        }

        // Initialize the game
        const game = new TicTacToe();

        // Add event listeners to cells
        document.querySelectorAll('.cell').forEach(cell => {
            cell.addEventListener('click', () => {
                const index = parseInt(cell.dataset.index);
                game.makeMove(index);
            });
        });

        // Global functions for buttons
        function resetGame() {
            game.resetGame();
        }

        function resetScore() {
            game.resetScore();
        }

        // Add keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '9') {
                const index = parseInt(e.key) - 1;
                game.makeMove(index);
            } else if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });
    </script>
</body>
</html>
